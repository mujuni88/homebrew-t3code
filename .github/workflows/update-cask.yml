name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo pingdotgg/t3code --limit 1 --json tagName --jq '.[0].tagName')
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CURRENT=$(grep -oP 'version "\K[^"]+' Casks/t3code.rb)
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already at $VERSION"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Updating $CURRENT → $VERSION"
          fi

      - name: Compute SHA256
        if: steps.release.outputs.skip == 'false'
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          BASE="https://github.com/pingdotgg/t3code/releases/download/v${VERSION}"

          ARM_SHA=$(curl -sL "${BASE}/T3-Code-${VERSION}-arm64.zip" | sha256sum | cut -d' ' -f1)
          X64_SHA=$(curl -sL "${BASE}/T3-Code-${VERSION}-x64.zip" | sha256sum | cut -d' ' -f1)

          echo "arm64=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x64=$X64_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect app name
        if: steps.release.outputs.skip == 'false'
        id: app
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if echo "$VERSION" | grep -q "nightly"; then
            echo 'name=T3 Code (Nightly).app' >> "$GITHUB_OUTPUT"
          else
            echo 'name=T3 Code (Alpha).app' >> "$GITHUB_OUTPUT"
          fi

      - name: Update Cask
        if: steps.release.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          ARM_SHA="${{ steps.sha.outputs.arm64 }}"
          X64_SHA="${{ steps.sha.outputs.x64 }}"
          APP_NAME="${{ steps.app.outputs.name }}"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/t3code.rb
          sed -i "/on_arm do/{n;s/sha256 \".*\"/sha256 \"${ARM_SHA}\"/}" Casks/t3code.rb
          sed -i "/on_intel do/{n;s/sha256 \".*\"/sha256 \"${X64_SHA}\"/}" Casks/t3code.rb
          sed -i "s/app \".*\"/app \"${APP_NAME}\"/" Casks/t3code.rb

          cat Casks/t3code.rb

      - name: Commit and push
        if: steps.release.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/t3code.rb
          git commit -m "bump t3code to ${VERSION}"
          git push
